<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom fade-in animation */
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* Add glow effect */
        @keyframes glow {
            0% {
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            }
            50% {
                box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            }
            100% {
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            }
        }
    </style>
</head>
<body class="bg-gradient-to-r from-blue-300 to-pink-400 font-sans animate-fadeIn">

    <div class="min-h-screen flex flex-col justify-between">

        <!-- Header with background animation -->
        <header class="bg-white shadow-lg py-12 mb-8 rounded-b-xl transform hover:scale-105 transition-all duration-500 ease-in-out">
            <h1 class="text-5xl font-bold text-center text-gray-800 tracking-tight hover:text-pink-600 transition-all transform hover:scale-110">
                Task Manager
            </h1>
        </header>

        <!-- Main Content -->
        <main class="flex justify-center px-4 md:px-8">
            <div id="root" class="bg-white rounded-xl shadow-xl p-10 w-full md:max-w-4xl transform hover:scale-105 hover:shadow-2xl transition-all duration-300 ease-in-out">

                <!-- Add Task Button with animation -->
                <div class="mb-6 text-center">
                    <button class="bg-gradient-to-r from-blue-500 to-pink-500 text-white py-3 px-6 rounded-full text-lg font-semibold shadow-lg hover:from-blue-600 hover:to-pink-600 hover:shadow-2xl transition-all transform hover:scale-105">
                        Add Task
                    </button>
                </div>
        <!-- Footer with glow effect -->
        <footer class="bg-gray-800 text-white text-center py-6 mt-8 animate-glow">
            <p class="text-sm">&copy; 2025 Task Manager. All Rights Reserved.</p>
        </footer>
    </div>

</body>
</html>
